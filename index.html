<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="acceuil.css">
    <title>Accueil</title>
</head>
<body>
    <div class="main">
        <div class="tete menu container d-block col-2">
            <div>
                <div>
                    <a href="\" class="menu-item">
                        <i class="bi bi-house-door-fill" style="font-size: 1.5rem; color: whitesmoke;"></i>
                        <p class="mt-2">&nbsp;&nbsp;Accueil</p>
                    </a>
                </div>
                <div>
                    <a href="\" class="menu-item">
                        <i class="bi bi-send-fill" style="font-size: 1.5rem; color: whitesmoke;"></i>
                        <p class="mt-2">&nbsp;&nbsp;Chat</p>
                    </a>
                </div>
                <div>
                    <a href="\" class="menu-item">
                        <i class="bi bi-clock-history" style="font-size: 1.5rem; color: whitesmoke;"></i>
                        <p class="mt-2">&nbsp;&nbsp;Historiques</p>
                    </a>
                </div>
                <div>
                    <a href="\" class="menu-item">
                        <i class="bi bi-gear-fill" style="font-size: 1.5rem; color: whitesmoke;"></i>
                        <p class="mt-2">&nbsp;&nbsp;Paramètres</p>
                    </a>
                </div>
            </div>
            <br>
            <br>
            <br>
            <br>
            <div>
                <a href="\" class="menu-item">
                    <i class="bi bi-question-circle-fill" style="font-size: 1.5rem; color: whitesmoke;"></i>
                    <p class="mt-2">&nbsp;&nbsp;Aide</p>
                </a>
            </div>
        </div>
        <div class="corp container col-10">
            <!-- Pour la page de ce côté -->
            <div class="entete container col-11">
                <div class="profil d-flex justify-content-between">
                    <img src="img/image.png" alt="Image de profil">
                    <p style="margin-top: 8px; font-size: large; font-weight: 500;">LUCY Flo</p>
                </div>
                <div class="actions d-flex align-items-center justify-content-between">
                    <div class="recherche d-flex align-items-center">
                        <a href="\"><i class="bi bi-search" style="font-size: 1.5rem; color: rgb(36, 0, 243);"></i></a>
                        <input type="text" placeholder="Rechercher">
                    </div>
                    <i class="bi bi-bell"  style="font-size: 1.5rem; color: rgb(0, 68, 254);"></i>
                    <button class="btn btn-primary ml-5">Déconnexion</button>
                </div>
            </div>
            <div id="connexion-request-response-container">
                <p id="connexion-request-response-text"></p>
                <button class="btn btn-primary" style="display: none;" id="control-btn">Prendre le contrôle</button>
            </div>
            <div id="connexion-request-container">
                <div class="identifiant container">
                    <div class="container idmp">
                        <i class="fas fa-desktop"></i>
                        <p style="font-size: 20px; font-weight: 400;">
                        <span>VOTRE ID : </span></p>
                        <strong id="counter" style="font-size: 30px;"></strong>
                    </div>
                    <div class="image container mr-0">
                        <img src="img/12982575_5116505.jpg" alt="" style="border-radius: 2rem; height: 250px; width: 500px;">
                    </div>
                </div>
                <div class="reseau container">
                    <p style="font-size: 26px; font-weight: 600;">Accédez à un pc distant :</p>
                    <div class="col-md-4 center">
                        <div class="form-group mb-3">
                            <input type="text" id="partner-id-input" placeholder="Entrez l'ID du partenaire">
                        </div>
                        <button class="btn btn-primary" id="connect-btn">Se connecter</button>
                    </div>
                </div>
            </div>
            
            <!-- Nouvelle section pour le partage d'écran -->
            <div id="screen-sharing-container" style="display: none;">
                <h3>Partage d'écran</h3>
                <div class="row">
                    <div class="col-md-6">
                        <h4>Votre écran</h4>
                        <video id="localVideo" autoplay muted style="width: 100%; max-height: 300px; background-color: #ddd;"></video>
                    </div>
                    <div class="col-md-6">
                        <h4>Écran distant</h4>
                        <video id="remoteVideo" autoplay style="width: 100%; max-height: 300px; background-color: #ddd;"></video>
                    </div>
                </div>
                <button class="btn btn-danger mt-3" id="stop-sharing-btn" style="display: none;">Arrêter le partage</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
